name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Run tests
        run: node --test

  action-smoke:
    name: Action · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Generate reviewed lock baseline
        run: node src/cli.js check fixtures/portable-extension --config fixtures/portable-extension/harnessmark.yml --write-lock harnessmark.lock.json --fail-on none
      - name: Run HarnessMark as an Action
        id: harnessmark
        uses: ./
        with:
          path: fixtures/portable-extension
          config: fixtures/portable-extension/harnessmark.yml
          format: html
          output: harnessmark-passport.html
          annotations: false
          compare-lock: harnessmark.lock.json
          lock-output: current-harnessmark.lock.json
          fail-on-lock-drift: any
      - name: Verify outputs, report, and lock
        shell: bash
        env:
          HM_RESULT: ${{ steps.harnessmark.outputs.result }}
          HM_ERRORS: ${{ steps.harnessmark.outputs.errors }}
          HM_LOCK_DRIFT: ${{ steps.harnessmark.outputs.lock-drift }}
          HM_LOCK_EVENTS: ${{ steps.harnessmark.outputs.lock-events }}
          HM_LOCK_DIGEST: ${{ steps.harnessmark.outputs.lock-digest }}
        run: |
          test "$HM_RESULT" = "pass"
          test "$HM_ERRORS" = "0"
          test "$HM_LOCK_DRIFT" = "stable"
          test "$HM_LOCK_EVENTS" = "0"
          case "$HM_LOCK_DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
          test -s harnessmark-passport.html
          test -s current-harnessmark.lock.json

  campaign:
    name: Adversarial campaign
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run isolated rejection fixtures
        run: node scripts/run-campaign.js
      - name: Verify package contents
        env:
          npm_config_offline: "true"
          npm_config_update_notifier: "false"
          npm_config_audit: "false"
        run: npm pack --dry-run
