<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">HarnessMark</title>
  <desc id="description">Cross-harness conformance testing for AI-agent extensions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b17"/>
      <stop offset="0.55" stop-color="#10162b"/>
      <stop offset="1" stop-color="#2a1654"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65f0c2"/>
      <stop offset="1" stop-color="#a883ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <g opacity=".18" stroke="#8e7ccf">
    <path d="M0 120H1280M0 240H1280M0 360H1280M0 480H1280"/>
    <path d="M160 0V640M320 0V640M480 0V640M640 0V640M800 0V640M960 0V640M1120 0V640"/>
  </g>
  <g transform="translate(82 112)" filter="url(#glow)">
    <path d="M92 22 236 74v118c0 104-56 172-144 214C4 364-52 296-52 192V74Z" fill="#0c1327" stroke="url(#mark)" stroke-width="14"/>
    <path d="m15 203 52 52 118-130" fill="none" stroke="url(#mark)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-7" cy="98" r="9" fill="#65f0c2"/><circle cx="190" cy="304" r="9" fill="#a883ff"/>
  </g>
  <g transform="translate(385 145)">
    <text x="0" y="98" fill="#f3f6ff" font-family="Inter,Segoe UI,sans-serif" font-size="104" font-weight="800" letter-spacing="-4">HarnessMark</text>
    <text x="4" y="165" fill="#b7c3df" font-family="Inter,Segoe UI,sans-serif" font-size="31">One extension. Four harnesses. Evidence, not vibes.</text>
    <g transform="translate(4 230)" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="700">
      <rect width="142" height="52" rx="26" fill="#18253b" stroke="#65f0c2"/><text x="71" y="34" text-anchor="middle" fill="#65f0c2">CODEX</text>
      <rect x="158" width="192" height="52" rx="26" fill="#18253b" stroke="#9c84ea"/><text x="254" y="34" text-anchor="middle" fill="#d7cbff">CLAUDE CODE</text>
      <rect x="366" width="146" height="52" rx="26" fill="#18253b" stroke="#62a8ff"/><text x="439" y="34" text-anchor="middle" fill="#9dc9ff">CURSOR</text>
      <rect x="528" width="240" height="52" rx="26" fill="#18253b" stroke="#f1c46c"/><text x="648" y="34" text-anchor="middle" fill="#ffdc94">GITHUB COPILOT</text>
    </g>
    <text x="4" y="365" fill="#7e8aa6" font-family="ui-monospace,SFMono-Regular,monospace" font-size="19">documented-conformance · deterministic · zero runtime dependencies</text>
  </g>
