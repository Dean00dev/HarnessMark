name: HarnessMark Conformance
description: Prove an AI-agent extension matches the documented formats it claims to support.
author: Dean Egan
branding:
  icon: check-square
  color: purple
inputs:
  path:
    description: Repository or extension directory to inspect.
    required: false
    default: .
  config:
    description: Optional HarnessMark manifest path.
    required: false
    default: ""
  fail-on:
    description: Minimum severity that fails the step (error, warning, or none).
    required: false
    default: error
  format:
    description: Report format written to output (json, sarif, junit, html, or table).
    required: false
    default: sarif
  output:
    description: Destination report path. Defaults to harnessmark.<format>.
    required: false
    default: ""
  annotations:
    description: Emit GitHub workflow annotations.
    required: false
    default: "true"
  compare-lock:
    description: Optional saved HarnessMark conformance lock to compare against.
    required: false
    default: ""
  lock-output:
    description: Optional path to write the current deterministic conformance lock.
    required: false
    default: ""
  fail-on-lock-drift:
    description: Drift gate for the saved lock (any, warning, error, or none).
    required: false
    default: any
outputs:
  result:
    description: pass, warn, or fail.
  errors:
    description: Number of error findings.
  warnings:
    description: Number of warning findings.
  report:
    description: Path to the generated report.
  lock-digest:
    description: SHA-256 digest of the current compatibility contract.
  lock-events:
    description: Number of conformance-lock drift events.
  lock-drift:
    description: not-configured, stable, changed, or failed.
runs:
  using: node20
  main: src/action.js
